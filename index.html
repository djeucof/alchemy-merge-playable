<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Alchemy Merge — Playable Ad Prototype</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #090b16;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }

  #stage-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 460px;
    max-height: 860px;
    aspect-ratio: 9 / 16;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    overflow: hidden;
    background: #10142b;
  }

  @media (max-width: 500px) {
    #stage-wrap {
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .top-bar {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
    z-index: 10;
  }

  .hud-pill {
    pointer-events: auto;
    background: rgba(15, 20, 46, 0.76);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 7px 11px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }

  .moves-pill {
    pointer-events: auto;
    background: rgba(251, 191, 36, 0.14);
    border: 1px solid rgba(251, 191, 36, 0.38);
    border-radius: 999px;
    padding: 7px 10px;
    color: #fde68a;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
  }

  .progress-track {
    width: 72px;
    height: 8px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #38bdf8, #a855f7, #f59e0b);
    transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .icon-btn {
    pointer-events: auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(15, 20, 46, 0.78);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .icon-btn:active {
    transform: scale(0.9);
  }

  .ad-badge {
    pointer-events: auto;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.65);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 4px 7px;
    border-radius: 6px;
  }

  #end-card {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 28%, rgba(168, 85, 247, 0.28), rgba(9, 11, 24, 0.94) 72%);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.94);
    transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 20;
  }

  #end-card.visible {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

  .end-title {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    margin: 12px 0 6px;
    letter-spacing: -0.02em;
  }

  .end-sub {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.76);
    margin: 0 0 22px;
    line-height: 1.45;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 310px;
    margin-bottom: 24px;
  }

  .stat-box {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 10px 8px;
  }

  .stat-val {
    font-size: 17px;
    font-weight: 800;
    color: #fbbf24;
  }

  .stat-lbl {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.65);
    margin-top: 2px;
  }

  .cta-btn {
    width: 100%;
    max-width: 290px;
    padding: 16px 24px;
    border: none;
    border-radius: 18px;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #111827;
    background: linear-gradient(135deg, #fde047, #f59e0b 60%, #fb7185);
    box-shadow: 0 12px 32px rgba(245, 158, 11, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.55);
    cursor: pointer;
    animation: pulseCta 1.45s ease-in-out infinite;
  }

  @keyframes pulseCta {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  .replay-btn {
    margin-top: 14px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: rgba(255, 255, 255, 0.85);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .toast {
    position: absolute;
    bottom: 86px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(17, 24, 39, 0.92);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 30;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <canvas id="game"></canvas>

  <div class="top-bar">
    <div class="hud-pill">
      <span>👑</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span id="score-label">0</span>
    </div>
    <div class="moves-pill" id="moves-left-label">To finish: 6</div>
    <div style="display:flex;align-items:center;gap:5px;">
      <span class="ad-badge">Playable</span>
      <button class="icon-btn" id="mute-btn" title="Sound">🔊</button>
    </div>
  </div>

  <div id="end-card">
    <div id="end-icon" style="font-size:64px;line-height:1;">👑</div>
    <div class="end-title" id="end-title">Crown crafted!</div>
    <p class="end-sub" id="end-sub">Masterpiece unlocked! Install now to discover 30+ rare items.</p>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="stat-merges">0</div>
        <div class="stat-lbl">Merges</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-combo">x1</div>
        <div class="stat-lbl">Max combo</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-time">0.0s</div>
        <div class="stat-lbl">Session</div>
      </div>
    </div>
    <button class="cta-btn" id="cta-btn">Install Now</button>
    <button class="replay-btn" id="replay-btn">Replay</button>
  </div>

  <div class="toast" id="toast">CTA Triggered! (Playable Store Redirect)</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('stage-wrap');

  const progressFill = document.getElementById('progress-fill');
  const scoreLabel = document.getElementById('score-label');
  const movesLeftLabel = document.getElementById('moves-left-label');
  const muteBtn = document.getElementById('mute-btn');
  const endCard = document.getElementById('end-card');
  const endTitle = document.getElementById('end-title');
  const endSub = document.getElementById('end-sub');
  const endIcon = document.getElementById('end-icon');
  const statMerges = document.getElementById('stat-merges');
  const statCombo = document.getElementById('stat-combo');
  const statTime = document.getElementById('stat-time');
  const ctaBtn = document.getElementById('cta-btn');
  const replayBtn = document.getElementById('replay-btn');
  const toast = document.getElementById('toast');

  const TIERS = [
    { level: 1, name: 'Spark', color1: '#38bdf8', color2: '#2563eb', glow: 'rgba(56,189,248,0.65)', glyph: '✦', points: 25 },
    { level: 2, name: 'Crystal', color1: '#c084fc', color2: '#7e22ce', glow: 'rgba(192,132,252,0.7)', glyph: '❖', points: 60 },
    { level: 3, name: 'Ruby', color1: '#fb7185', color2: '#e11d48', glow: 'rgba(251,113,133,0.75)', glyph: '◈', points: 140 },
    { level: 4, name: 'Sun', color1: '#fde047', color2: '#ea580c', glow: 'rgba(253,224,71,0.85)', glyph: '☀', points: 320 },
    { level: 5, name: 'Crown', color1: '#fef08a', color2: '#f59e0b', glow: 'rgba(251,191,36,0.95)', glyph: '👑', points: 750 }
  ];

  const MAX_TARGET_MOVES = 6;
  const GRID_SIZE = 3;

  let width = 360;
  let height = 640;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  let boardRect = { x: 24, y: 180, size: 312, cell: 96, gap: 12 };
  let cells = [];
  let dragging = null;
  let particles = [];
  let popups = [];
  let shockwaves = [];
  let shakeTime = 0;
  let shakeMag = 0;

  let score = 0;
  let mergesCount = 0;
  let combo = 1;
  let maxCombo = 1;
  let lastMergeAt = 0;
  let sessionStartAt = null;
  let sessionEndAt = null;
  let ended = false;
  let hasInteracted = false;
  let idleTimer = 0;
  let muted = false;
  let audioCtx = null;

  function ensureAudio() {
    if (muted) return null;
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playTone(freq, type = 'sine', duration = 0.14, gainPeak = 0.14, slideTo = null) {
    const actx = ensureAudio();
    if (!actx) return;
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(gainPeak, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function playPickup() {
    playTone(340, 'triangle', 0.08, 0.1, 460);
  }

  function playMerge(level, currentCombo) {
    const baseFreq = 320 + level * 85 + (currentCombo - 1) * 45;
    playTone(baseFreq, 'sine', 0.2, 0.18, baseFreq * 1.45);
    setTimeout(() => playTone(baseFreq * 1.5, 'triangle', 0.18, 0.12), 55);
  }

  function playWin() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((n, idx) => {
      setTimeout(() => playTone(n, 'triangle', 0.25, 0.15), idx * 85);
    });
  }

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) ensureAudio();
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  ctaBtn.addEventListener('click', () => {
    playTone(660, 'sine', 0.16, 0.15, 880);
    showToast('CTA Click → App Store / Google Play');
  });

  replayBtn.addEventListener('click', () => {
    resetGame();
  });

  function resize() {
    const rect = wrap.getBoundingClientRect();
    width = Math.max(280, rect.width);
    height = Math.max(480, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const boardSize = Math.min(width - 44, height * 0.45, 340);
    const gap = Math.round(boardSize * 0.04);
    const cell = (boardSize - gap * (GRID_SIZE + 1)) / GRID_SIZE;
    const x = (width - boardSize) / 2;
    const y = height * 0.34;

    boardRect = { x, y, size: boardSize, cell, gap };
    layoutCells();
  }

  function getCellCenter(r, c) {
    return {
      x: boardRect.x + boardRect.gap + c * (boardRect.cell + boardRect.gap) + boardRect.cell / 2,
      y: boardRect.y + boardRect.gap + r * (boardRect.cell + boardRect.gap) + boardRect.cell / 2
    };
  }

  function layoutCells() {
    for (const item of cells) {
      const pt = getCellCenter(item.r, item.c);
      item.homeX = pt.x;
      item.homeY = pt.y;
      if (!dragging || dragging.item !== item) {
        item.x = pt.x;
        item.y = pt.y;
      }
    }
  }

  function createItem(r, c, tier = 1, pop = true) {
    const pt = getCellCenter(r, c);
    return {
      id: Math.random().toString(36).slice(2, 9),
      r,
      c,
      tier,
      x: pt.x,
      y: pt.y,
      homeX: pt.x,
      homeY: pt.y,
      scale: pop ? 0.15 : 1,
      targetScale: 1,
      velScale: pop ? 6 : 0,
      wobble: 0
    };
  }

  function resetGame() {
    ended = false;
    endCard.classList.remove('visible');
    score = 0;
    mergesCount = 0;
    combo = 1;
    maxCombo = 1;
    lastMergeAt = 0;
    sessionStartAt = null;
    sessionEndAt = null;
    hasInteracted = false;
    idleTimer = 0;
    dragging = null;
    particles = [];
    popups = [];
    shockwaves = [];
    shakeTime = 0;

    cells = [
      createItem(0, 0, 1, true),
      createItem(0, 1, 1, true),
      createItem(1, 1, 2, true),
      createItem(1, 2, 2, true),
      createItem(2, 0, 1, true),
      createItem(2, 2, 3, true)
    ];

    updateHud();
  }

  function updateHud() {
    scoreLabel.textContent = score.toLocaleString('en-US');
    const pct = Math.min(100, (mergesCount / MAX_TARGET_MOVES) * 100);
    progressFill.style.width = `${pct}%`;
    const left = Math.max(0, MAX_TARGET_MOVES - mergesCount);
    movesLeftLabel.textContent = left > 0 ? `To finish: ${left}` : 'Finish!';
  }

  function findCellAt(px, py) {
    for (const item of cells) {
      const dx = px - item.x;
      const dy = py - item.y;
      const hitR = boardRect.cell * 0.48;
      if (dx * dx + dy * dy <= hitR * hitR) {
        return item;
      }
    }
    return null;
  }

  function findSlotAt(px, py) {
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const pt = getCellCenter(r, c);
        const half = (boardRect.cell + boardRect.gap) * 0.5;
        if (Math.abs(px - pt.x) <= half && Math.abs(py - pt.y) <= half) {
          return { r, c };
        }
      }
    }
    return null;
  }

  function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function onPointerDown(e) {
    if (ended) return;
    ensureAudio();
    const pos = getPointerPos(e);
    const hit = findCellAt(pos.x, pos.y);
    if (!hit) return;

    if (sessionStartAt === null) {
      sessionStartAt = performance.now();
    }

    hasInteracted = true;
    idleTimer = 0;
    hit.targetScale = 1.18;
    hit.wobble = 0.25;
    dragging = {
      item: hit,
      x: pos.x,
      y: pos.y
    };
    playPickup();
  }

  function onPointerMove(e) {
    if (!dragging || ended) return;
    const pos = getPointerPos(e);
    dragging.x = pos.x;
    dragging.y = pos.y;
    dragging.item.x = pos.x;
    dragging.item.y = pos.y;
  }

  function spawnBurst(x, y, color, count = 20, speedScale = 1) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const speed = (60 + Math.random() * 190) * speedScale;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 30,
        size: 3 + Math.random() * 5,
        color,
        alpha: 1,
        life: 0.45 + Math.random() * 0.35
      });
    }
  }

  function spawnPopup(x, y, text, color = '#fde047') {
    popups.push({
      x,
      y,
      vy: -65,
      text,
      color,
      alpha: 1,
      life: 0.85
    });
  }

  function triggerShake(mag = 7, duration = 0.18) {
    shakeMag = Math.max(shakeMag, mag);
    shakeTime = Math.max(shakeTime, duration);
  }

  function refillIfNeeded() {
    if (cells.length <= 2 && !ended) {
      const empty = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (!cells.some(it => it.r === r && it.c === c)) {
            empty.push({ r, c });
          }
        }
      }
      const addCount = Math.min(2, empty.length);
      for (let i = 0; i < addCount; i++) {
        const idx = Math.floor(Math.random() * empty.length);
        const slot = empty.splice(idx, 1)[0];
        cells.push(createItem(slot.r, slot.c, 1, true));
      }
    }
  }

  function finishPlayable(wonByCrown) {
    if (ended) return;
    ended = true;
    sessionEndAt = performance.now();
    const durationSec = sessionStartAt !== null
      ? ((sessionEndAt - sessionStartAt) / 1000).toFixed(1)
      : '0.0';

    statMerges.textContent = String(mergesCount);
    statCombo.textContent = `x${maxCombo}`;
    statTime.textContent = `${durationSec}s`;

    if (wonByCrown) {
      endIcon.textContent = '👑';
      endTitle.textContent = 'Crown crafted!';
      endSub.textContent = 'Masterpiece unlocked! Install now to discover 30+ rare items.';
      playWin();
      spawnBurst(width * 0.5, height * 0.35, '#fbbf24', 45, 1.35);
      spawnBurst(width * 0.3, height * 0.45, '#c084fc', 30, 1.15);
      spawnBurst(width * 0.7, height * 0.45, '#38bdf8', 30, 1.15);
    } else {
      endIcon.textContent = '✨';
      endTitle.textContent = 'Nice merges!';
      endSub.textContent = 'Great start! Install now to craft the final Crown.';
      playWin();
    }

    setTimeout(() => {
      endCard.classList.add('visible');
    }, 420);
  }

  function performMerge(source, target) {
    const now = performance.now();
    if (now - lastMergeAt < 1800) {
      combo = Math.min(5, combo + 1);
    } else {
      combo = 1;
    }
    lastMergeAt = now;
    maxCombo = Math.max(maxCombo, combo);

    const nextTierIndex = Math.min(TIERS.length - 1, source.tier);
    const nextTier = TIERS[nextTierIndex];
    const targetPt = getCellCenter(target.r, target.c);

    cells = cells.filter(it => it !== source && it !== target);
    const upgraded = createItem(target.r, target.c, nextTier.level, false);
    upgraded.x = targetPt.x;
    upgraded.y = targetPt.y;
    upgraded.scale = 1.45;
    upgraded.targetScale = 1;
    upgraded.velScale = -4;
    cells.push(upgraded);

    mergesCount += 1;
    const gained = nextTier.points * combo;
    score += gained;
    updateHud();

    playMerge(nextTier.level, combo);
    triggerShake(5 + nextTier.level * 1.4, 0.16);
    spawnBurst(targetPt.x, targetPt.y, nextTier.color1, 22 + nextTier.level * 4, 1 + nextTier.level * 0.12);
    shockwaves.push({
      x: targetPt.x,
      y: targetPt.y,
      r: boardRect.cell * 0.25,
      maxR: boardRect.cell * 1.15,
      color: nextTier.color1,
      alpha: 0.85
    });

    const popupText = combo > 1 ? `+${gained}  x${combo}!` : `+${gained}`;
    spawnPopup(targetPt.x, targetPt.y - 18, popupText, nextTier.color1);

    if (nextTier.level === TIERS.length || mergesCount >= MAX_TARGET_MOVES) {
      finishPlayable(nextTier.level === TIERS.length);
    } else {
      refillIfNeeded();
    }
  }

  function onPointerUp() {
    if (!dragging || ended) return;
    const item = dragging.item;
    item.targetScale = 1;

    let dropTarget = null;
    for (const other of cells) {
      if (other === item) continue;
      const dist = Math.hypot(item.x - other.x, item.y - other.y);
      if (dist < boardRect.cell * 0.65 && other.tier === item.tier && other.tier < TIERS.length) {
        dropTarget = other;
        break;
      }
    }

    if (dropTarget) {
      performMerge(item, dropTarget);
    } else {
      const slot = findSlotAt(item.x, item.y);
      if (slot) {
        const occupant = cells.find(it => it !== item && it.r === slot.r && it.c === slot.c);
        if (!occupant) {
          item.r = slot.r;
          item.c = slot.c;
          layoutCells();
          playTone(260, 'sine', 0.07, 0.08, 310);
        } else {
          item.x = item.homeX;
          item.y = item.homeY;
          item.wobble = 0.35;
          playTone(170, 'sawtooth', 0.09, 0.06, 130);
        }
      } else {
        item.x = item.homeX;
        item.y = item.homeY;
      }
    }

    dragging = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  function findHintPair() {
    for (let i = 0; i < cells.length; i++) {
      for (let j = i + 1; j < cells.length; j++) {
        if (cells[i].tier === cells[j].tier && cells[i].tier < TIERS.length) {
          return [cells[i], cells[j]];
        }
      }
    }
    return null;
  }

  function drawBackground(timeSec) {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#121736');
    grad.addColorStop(0.55, '#191338');
    grad.addColorStop(1, '#0c0f24');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 18; i++) {
      const sx = ((i * 97 + timeSec * (8 + (i % 4) * 3)) % (width + 40)) - 20;
      const sy = ((i * 61 + Math.sin(timeSec + i) * 14) % (height - 80)) + 40;
      const rad = 1.2 + (i % 3);
      ctx.fillStyle = `rgba(196, 181, 253, ${0.14 + (i % 5) * 0.04})`;
      ctx.beginPath();
      ctx.arc(sx, sy, rad, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 22px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ALCHEMY MERGE', width / 2, height * 0.15);

    ctx.fillStyle = 'rgba(255,255,255,0.68)';
    ctx.font = '500 13px system-ui, -apple-system, sans-serif';
    ctx.fillText('Merge matching elements to craft 👑', width / 2, height * 0.15 + 24);

    drawEvolutionStrip(width / 2, height * 0.255);
  }

  function drawEvolutionStrip(cx, cy) {
    const step = Math.min(54, (width - 48) / TIERS.length);
    const totalW = step * (TIERS.length - 1);
    const startX = cx - totalW / 2;

    for (let i = 0; i < TIERS.length; i++) {
      const t = TIERS[i];
      const x = startX + i * step;
      ctx.beginPath();
      ctx.arc(x, cy, 15, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = t.color1;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.glyph, x, cy + 0.5);

      if (i < TIERS.length - 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.32)';
        ctx.font = '700 11px system-ui, sans-serif';
        ctx.fillText('›', x + step / 2, cy);
      }
    }
    ctx.textBaseline = 'alphabetic';
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBoard() {
    ctx.save();
    ctx.fillStyle = 'rgba(11, 15, 36, 0.75)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1.5;
    roundRectPath(boardRect.x, boardRect.y, boardRect.size, boardRect.size, 22);
    ctx.fill();
    ctx.stroke();

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const cx = boardRect.x + boardRect.gap + c * (boardRect.cell + boardRect.gap);
        const cy = boardRect.y + boardRect.gap + r * (boardRect.cell + boardRect.gap);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.045)';
        roundRectPath(cx, cy, boardRect.cell, boardRect.cell, 15);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawOrb(item, timeSec) {
    const tier = TIERS[item.tier - 1] || TIERS[0];
    const radius = boardRect.cell * 0.34 * item.scale;
    const tilt = Math.sin(timeSec * 18 + item.wobble * 12) * item.wobble * 0.25;

    ctx.save();
    ctx.translate(item.x, item.y);
    ctx.rotate(tilt);

    ctx.shadowColor = tier.glow;
    ctx.shadowBlur = 18;

    const grad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, radius * 0.1, 0, 0, radius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.28, tier.color1);
    grad.addColorStop(1, tier.color2);

    ctx.beginPath();
    ctx.arc(0, 0, Math.max(2, radius), 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#111827';
    ctx.font = `900 ${Math.max(12, Math.round(radius * 0.85))}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tier.glyph, 0, 1);

    ctx.restore();
  }

  function drawHandPointer(timeSec) {
    if (ended || dragging) return;
    if (hasInteracted && idleTimer < 1.6) return;

    const pair = findHintPair();
    if (!pair) return;

    const [a, b] = pair;
    const cycle = (timeSec * 0.9) % 1;
    const ease = cycle < 0.5 ? 2 * cycle * cycle : 1 - Math.pow(-2 * cycle + 2, 2) / 2;

    const hx = a.x + (b.x - a.x) * ease;
    const hy = a.y + (b.y - a.y) * ease;

    ctx.save();
    ctx.translate(hx + 10, hy + 12);

    ctx.beginPath();
    ctx.arc(-10, -12, 18 + Math.sin(timeSec * 8) * 3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 26);
    ctx.lineTo(7, 20);
    ctx.lineTo(13, 31);
    ctx.lineTo(18, 28);
    ctx.lineTo(12, 17);
    ctx.lineTo(21, 17);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  let prevNow = performance.now();

  function tick(now) {
    const dt = Math.min(0.05, (now - prevNow) / 1000);
    prevNow = now;
    const timeSec = now / 1000;

    if (!dragging && !ended) {
      idleTimer += dt;
    }

    for (const item of cells) {
      const force = (item.targetScale - item.scale) * 140;
      item.velScale = (item.velScale + force * dt) * Math.pow(0.04, dt);
      item.scale += item.velScale * dt;
      item.wobble = Math.max(0, item.wobble - dt * 1.4);
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.r += (sw.maxR - sw.r) * Math.min(1, dt * 10);
      sw.alpha -= dt * 2.4;
      if (sw.alpha <= 0) shockwaves.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 320 * dt;
      p.life -= dt;
      p.alpha = Math.max(0, p.life / 0.65);
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      const pop = popups[i];
      pop.y += pop.vy * dt;
      pop.life -= dt;
      pop.alpha = Math.max(0, pop.life / 0.85);
      if (pop.life <= 0) popups.splice(i, 1);
    }

    ctx.save();
    if (shakeTime > 0) {
      shakeTime = Math.max(0, shakeTime - dt);
      const sx = (Math.random() - 0.5) * shakeMag * 2;
      const sy = (Math.random() - 0.5) * shakeMag * 2;
      ctx.translate(sx, sy);
    }

    drawBackground(timeSec);
    drawBoard();

    for (const sw of shockwaves) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = Math.max(0, sw.alpha);
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    for (const item of cells) {
      if (dragging && dragging.item === item) continue;
      drawOrb(item, timeSec);
    }

    if (dragging) {
      drawOrb(dragging.item, timeSec);
    }

    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const pop of popups) {
      ctx.save();
      ctx.globalAlpha = pop.alpha;
      ctx.font = '900 18px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#090b16';
      ctx.fillText(pop.text, pop.x + 1.5, pop.y + 1.5);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, pop.x, pop.y);
      ctx.restore();
    }

    drawHandPointer(timeSec);
    ctx.restore();

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  resetGame();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
